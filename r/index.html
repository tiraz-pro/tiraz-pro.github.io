<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>متابعة مشروعك | طراز ريموت</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="طراز ريموت">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0D0E;--panel:#131719;--panel2:#0F1213;--line:#262D31;--gold:#B78D65;
 --gold-hi:#D8B78E;--gold-dim:rgba(183,141,101,.12);--tx:#EDEAE6;--mut:#A8B0B6;--mut2:#7A828A;
 --ok:#199e70;--ok-hi:#5FCF8E;--warn:#c98500;--info:#3987e5;--bad:#D96A5B}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--ink);color:var(--tx);font-family:Tajawal,system-ui,sans-serif;
 line-height:1.7;padding-bottom:78px;overflow-x:hidden}
.mono{font-family:'IBM Plex Mono',monospace;font-size:.92em;direction:ltr;unicode-bidi:isolate}
.wrap{max-width:940px;margin:0 auto;padding:0 16px}
a{color:inherit;text-decoration:none}

/* هيدر */
header{background:linear-gradient(180deg,#12171A,var(--ink));border-bottom:1px solid var(--line);
 padding:16px 0 18px;position:sticky;top:0;z-index:40;backdrop-filter:blur(14px)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lg{display:flex;align-items:center;gap:10px}
.lgw b{display:block;font-size:15px;font-weight:800;letter-spacing:.05em;direction:ltr;line-height:1}
.lgw b i{color:var(--gold);font-style:normal}
.lgw small{display:block;direction:ltr;font-family:'IBM Plex Mono',monospace;font-size:7px;
 color:var(--mut2);margin-top:4px;width:100%;text-align:justify;text-align-last:justify;
 text-justify:inter-character}
.live{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut2);
 background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 11px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok-hi);flex:0 0 auto;
 animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
h1{font-size:clamp(18px,4.2vw,25px);font-weight:800;margin-top:14px;line-height:1.35}
.sub{color:var(--mut2);font-size:13px;margin-top:5px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:18px}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 13px}
.kpi .v{font-size:26px;font-weight:800;line-height:1.1;font-family:'IBM Plex Mono',monospace;
 direction:ltr;text-align:start}
.kpi .l{font-size:11.6px;color:var(--mut2);margin-top:4px}
.kpi.g .v{color:var(--ok-hi)} .kpi.o .v{color:var(--gold-hi)} .kpi.w .v{color:var(--warn)}

/* تبويبات */
nav.tabs{position:fixed;bottom:0;inset-inline:0;background:rgba(11,13,14,.96);
 backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:50;
 padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:940px;margin:0 auto;display:flex}
.tab{flex:1;padding:11px 4px 9px;text-align:center;color:var(--mut2);font-size:11px;
 border-top:2px solid transparent;transition:.2s;cursor:pointer;background:none;border-inline:0;
 border-bottom:0;font-family:inherit}
.tab.on{color:var(--gold-hi);border-top-color:var(--gold)}
.tab svg{display:block;margin:0 auto 3px;opacity:.9}
section.pane{display:none;padding-top:22px}
section.pane.on{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* عام */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
 padding:16px 17px;margin-bottom:11px}
.card h3{font-size:15px;margin-bottom:11px;display:flex;align-items:center;gap:8px}
.cat{font-size:11.5px;color:var(--gold);font-family:'IBM Plex Mono',monospace;
 letter-spacing:.08em;margin:22px 0 9px}
.bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:4px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row b{font-size:14.5px;font-weight:500}
.pct{font-family:'IBM Plex Mono',monospace;font-size:13px;direction:ltr}
.muted{color:var(--mut2);font-size:12.6px}
.note{font-size:13px;color:var(--mut);font-weight:300;margin-top:7px;line-height:1.75}
.chip{display:inline-block;font-size:11px;border-radius:6px;padding:3px 9px;white-space:nowrap}
.c-ok{background:rgba(25,158,112,.16);color:var(--ok-hi);border:1px solid rgba(25,158,112,.35)}
.c-run{background:rgba(201,133,0,.15);color:#E8B45C;border:1px solid rgba(201,133,0,.35)}
.c-idle{background:rgba(122,130,138,.12);color:var(--mut2);border:1px solid var(--line)}
.c-bad{background:rgba(217,106,91,.15);color:var(--bad);border:1px solid rgba(217,106,91,.35)}

/* صور */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.ph{aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--panel2);
 border:1px solid var(--line);cursor:pointer;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.ph:hover img{transform:scale(1.05)}
.ph span{position:absolute;inset-inline:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.85));
 padding:16px 8px 6px;font-size:10.5px;color:#DDD;font-family:'IBM Plex Mono',monospace;direction:ltr}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:99;display:none;
 place-items:center;padding:18px;cursor:zoom-out}
#lb.on{display:grid}
#lb img{max-width:100%;max-height:88vh;border-radius:10px}

/* فاضي */
.empty{text-align:center;padding:46px 18px;color:var(--mut2)}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:7px;font-weight:700}
.empty p{font-size:13.6px;font-weight:300;line-height:1.85;max-width:330px;margin:0 auto}
.empty .ic{font-size:34px;opacity:.35;margin-bottom:12px}

/* تنبيه */
.alert{background:linear-gradient(180deg,rgba(201,133,0,.13),rgba(201,133,0,.04));
 border:1px solid rgba(201,133,0,.35);border-radius:13px;padding:14px 16px;margin-bottom:12px;
 display:flex;gap:11px;font-size:13.6px;line-height:1.75}
.alert b{color:#E8B45C}
.offline{position:fixed;top:0;inset-inline:0;background:var(--warn);color:#0B0D0E;
 text-align:center;padding:6px;font-size:12.5px;font-weight:700;z-index:99;display:none}
.offline.on{display:block}

/* تحميل */
.sk{background:linear-gradient(90deg,var(--panel) 25%,#1A1F22 50%,var(--panel) 75%);
 background-size:200% 100%;animation:sh 1.4s infinite;border-radius:12px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.foot{text-align:center;padding:30px 16px 10px;color:var(--mut2);font-size:12px;
 border-top:1px solid var(--line);margin-top:26px}
.foot a{color:var(--gold-hi)}
</style></head><body>

<div class="offline" id="off"></div>

<header><div class="wrap">
  <div class="hd">
    <div class="lg"><svg class="tz-mark" viewBox="0 0 330 580" width="17" height="30"
 xmlns="http://www.w3.org/2000/svg" role="img" aria-label="شعار طراز">
<defs><linearGradient id="rl" x1=".08" y1="0" x2=".72" y2="1">
 <stop offset="0" stop-color="#8E7440"/><stop offset=".22" stop-color="#C4A87C"/>
 <stop offset=".5" stop-color="#E4D2A8"/><stop offset=".78" stop-color="#C4A87C"/>
 <stop offset="1" stop-color="#8E7440"/></linearGradient></defs>
<g fill="url(#rl)">
 <path d="M0 0h330v50H0z"/>
 <path d="M0 60h130v50H0z"/>
 <path d="M200 60h120v50H200z"/>
 <path d="M80 60h50v470H80z"/>
 <path d="M140 50h50v530h-50z"/>
 <path d="M200 60h50v470l-70 50h-40v-50l60-50z"/>
</g>
</svg>
      <div class="lgw"><b>TIRAZ<i>.</i>PRO</b><small>Concept for Finishing</small></div></div>
    <div class="live"><span class="dot"></span><span id="last">…</span></div>
  </div>
  <h1 id="ttl">…</h1>
  <div class="sub" id="sub"></div>
  <div class="kpis" id="kpis">
    <div class="kpi sk" style="height:76px"></div><div class="kpi sk" style="height:76px"></div>
    <div class="kpi sk" style="height:76px"></div><div class="kpi sk" style="height:76px"></div>
  </div>
</div></header>

<div class="wrap" id="boot" style="padding-top:26px">
  <div class="sk" style="height:90px;margin-bottom:11px"></div>
  <div class="sk" style="height:130px;margin-bottom:11px"></div>
  <div class="sk" style="height:130px"></div>
</div>

<div class="wrap">
  <div id="alerts"></div>

  <section class="pane" id="p-items"><div id="items"></div></section>

    <span style="opacity:.6">طراز للتشطيبات والمقاولات · info@tiraz.pro</span>
  </div>
</div>

<nav class="tabs"><div class="tabs-in"><button class="tab on" data-t="sum"><svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>الملخص</button><button class="tab" data-t="items"><svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M3 5h2v2H3V5zm4 0h14v2H7V5zM3 11h2v2H3v-2zm4 0h14v2H7v-2zm-4 6h2v2H3v-2zm4 0h14v2H7v-2z"/></svg>البنود</button><button class="tab" data-t="photo"><svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M21 19V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z"/></svg>الصور</button><button class="tab" data-t="money"><svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>الفلوس</button><button class="tab" data-t="dec"><svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M12 2L2 7v6c0 5 4 9 10 11 6-2 10-6 10-11V7L12 2zm-1 15l-4-4 1.4-1.4L11 14.2l5.6-5.6L18 10l-7 7z"/></svg>القرارات</button><button class="tab" data-t="cam"><svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M17 10.5V7a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1v-3.5l4 4v-11l-4 4z"/></svg>الكاميرات</button></div></nav>
<div id="lb"><img alt=""></div>

<script>
const API='https://script.google.com/macros/s/AKfycbwyyXu2F-lge10rLC4uN0TiQAhJYVpI5cFj7EGluMX6vPxkayVbkTwgIkgSiB0xEGXgNg/exec';
const qs=new URLSearchParams(location.search);
const P=qs.get('p'), T=qs.get('t');
const KEY='tz_'+P;
let D=null;

const $=id=>document.getElementById(id)||{style:{},classList:{add(){},remove(){},toggle(){}},set innerHTML(v){},set textContent(v){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>Number(n||0).toLocaleString('en-US');

function ago(iso){
  if(!iso) return '';
  const d=new Date(String(iso).replace(' ','T'));
  if(isNaN(d)) return iso;
  const m=Math.floor((Date.now()-d)/60000);
  if(m<2) return 'دلوقتي';
  if(m<60) return 'من '+m+' دقيقة';
  const h=Math.floor(m/60);
  if(h<24) return 'من '+h+' ساعة';
  const dd=Math.floor(h/24);
  if(dd===1) return 'إمبارح';
  if(dd<30) return 'من '+dd+' يوم';
  return d.toLocaleDateString('ar-EG');
}

function barColor(p){ return p>=100?'var(--ok)':p>0?'var(--warn)':'var(--line)'; }
function stateChip(s,p){
  if(p>=100) return '<span class="chip c-ok">خلص</span>';
  if(p>0) return '<span class="chip c-run">شغال</span>';
  return '<span class="chip c-idle">لسه ما بدأش</span>';
}

/* ── التبويبات ── */
function tab(n){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.t===n));
  document.querySelectorAll('.pane').forEach(s=>s.classList.toggle('on',s.id==='p-'+n));
  window.scrollTo({top:0,behavior:'smooth'});
  try{ history.replaceState(null,'','#'+n); }catch(e){}
}

/* ── الرسم ── */
function render(d){
  D=d;
  const pr=d.project, k=d.kpi;
  $('ttl').textContent=pr.name||'مشروعك';
  $('sub').innerHTML=esc(pr.code)+' · '+esc(pr.area||'')+' م²'+
    (pr.start?' · بدأ '+esc(String(pr.start).split(' ')[0]):'');
  $('last').textContent = d.lastUpdate ? ago(d.lastUpdate) : 'مفيش تحديث لسه';

  $('kpis').innerHTML=[
    ['g',k.progress+'%','نسبة الإنجاز'],
    ['o',k.itemsDone+'/'+k.itemsTotal,'بنود خلصت'],
    ['w',(k.budget?k.spentPct+'%':'—'),'المنصرف من الميزانية'],
    ['',(d.photos.length||0),'صورة من الموقع']
  ].map(([c,v,l])=>`<div class="kpi ${c}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');

  /* تنبيهات */
  let al='';
  if(k.decisionsOpen) al+=`<div class="alert"><b>◆</b><div><b>مستني قرار منك</b> — ${k.decisionsOpen} قرار.
    كل يوم تأخير فيهم بيأخّر التسليم بيوم. شوف تبويبة «القرارات».</div></div>`;
  if(k.paymentsDue) al+=`<div class="alert"><b>◆</b><div><b>دفعة مستحقة</b> — ${k.paymentsDue}.
    التفاصيل في تبويبة «الفلوس».</div></div>`;
  $('alerts').innerHTML=al;

  /* الملخص: آخر التحديثات */
  $('feed').innerHTML = d.updates.length ? d.updates.slice(0,12).map(u=>{
    const it=d.items.find(i=>i.code===u.item)||{};
    const ph=(u.photos||[]).slice(0,3).map(p=>`<div class="ph" onclick="lb('${p}')"><img loading="lazy" src="${p}"></div>`).join('');
    return `<div class="card">
      <div class="row"><b>${esc(it.name||u.item)}</b><span class="muted mono">${ago(u.at)}</span></div>
      <div class="note">${esc(u.note)}</div>
      <div class="bar"><i style="width:${u.pct}%;background:${barColor(u.pct)}"></i></div>
      ${ph?`<div class="grid" style="margin-top:10px">${ph}</div>`:''}
    </div>`;
  }).join('') : empty('📋','لسه مفيش تحديثات منشورة',
     'أول ما المهندس يبعت تحديث من الموقع والمكتب يراجعه، هيظهر هنا بصوره وتاريخه.');

  /* البنود */
  const cats={};
  d.items.forEach(i=>{(cats[i.cat]=cats[i.cat]||[]).push(i)});
  $('items').innerHTML=Object.entries(cats).map(([c,arr])=>{
    const avg=Math.round(arr.reduce((a,i)=>a+i.pct,0)/arr.length);
    return `<div class="cat">${esc(c)} · ${avg}%</div>`+arr.map(i=>`
      <div class="card" style="padding:13px 15px">
        <div class="row"><b>${esc(i.name)}</b>
          <span>${stateChip(i.state,i.pct)} <span class="pct">${i.pct}%</span></span></div>
        <div class="bar"><i style="width:${i.pct}%;background:${barColor(i.pct)}"></i></div>
        ${i.note?`<div class="note">${esc(i.note)} <span class="muted">· ${ago(i.at)}</span></div>`:''}
      </div>`).join('');
  }).join('');

  /* الصور */
  $('photos').innerHTML = d.photos.length
    ? `<div class="grid">`+d.photos.map(p=>`<div class="ph" onclick="lb('${p.url}')">
         <img loading="lazy" src="${p.url}"><span>${esc(String(p.at).split(' ')[0])}</span></div>`).join('')+`</div>`
    : empty('📷','مفيش صور لسه','الصور بتتصوّر في الموقع وبتوصل هنا بعد مراجعة المكتب — عادةً في نفس اليوم.');

  /* الفلوس */
  let m='';
  if(k.budget){
    m+=`<div class="card"><h3>الميزانية</h3>
      <div class="row"><span class="muted">المعتمد</span><b class="mono">${money(k.budget)}</b></div>
      <div class="row" style="margin-top:6px"><span class="muted">المنصرف</span>
        <b class="mono" style="color:var(--gold-hi)">${money(k.spent)}</b></div>
      <div class="bar" style="margin-top:10px"><i style="width:${Math.min(100,k.spentPct)}%;
        background:${k.spentPct>k.progress+10?'var(--bad)':'var(--gold)'}"></i></div>
      <div class="muted" style="margin-top:8px">المنصرف ${k.spentPct}% مقابل إنجاز ${k.progress}%
        ${k.spentPct>k.progress+10?' — <b style="color:var(--bad)">فيه فرق يستاهل مراجعة</b>':''}</div></div>`;
    if(d.boq.length) m+=`<div class="card"><h3>بند بند</h3>`+d.boq.map(b=>`
      <div style="margin-bottom:11px"><div class="row"><b style="font-size:13.6px">${esc(b.cat)}</b>
        <span class="pct">${money(b.spent)} / ${money(b.budget)}</span></div>
      <div class="bar"><i style="width:${Math.min(100,b.pct)}%;background:var(--gold)"></i></div></div>`).join('')+`</div>`;
  }
  if(d.payments.length) m+=`<div class="card"><h3>الدفعات</h3>`+d.payments.map(p=>{
    const c=p.state==='مدفوعة'?'c-ok':p.state==='متأخرة'?'c-bad':p.state==='مستحقة'?'c-run':'c-idle';
    return `<div class="row" style="margin-bottom:9px"><div><b style="font-size:14px">${esc(p.desc)}</b>
      <div class="muted">${esc(p.due||'')}</div></div>
      <div style="text-align:end"><div class="mono">${money(p.amount)}</div>
      <span class="chip ${c}">${esc(p.state)}</span></div></div>`;
  }).join('')+`</div>`;
  $('money').innerHTML = m || empty('◆','الجزء المالي لسه ما اتفعّلش',
    'أول ما المقايسة تتعتمد، هتشوف هنا كل جنيه راح فين بفاتورته.');

  /* القرارات */
  $('dec').innerHTML = d.decisions.length ? d.decisions.map(x=>`
    <div class="card"><div class="row"><b>${esc(x.title)}</b>
      <span class="chip ${x.state==='مطلوب'?'c-run':'c-ok'}">${esc(x.state)}</span></div>
      <div class="note">${esc(x.why)}</div>
      ${x.before?`<div class="muted" style="margin-top:8px">مطلوب قبل: ${esc(x.before)}</div>`:''}
      ${x.impact?`<div class="alert" style="margin:10px 0 0"><b>◆</b><div>${esc(x.impact)}</div></div>`:''}
    </div>`).join('') : empty('✓','مفيش قرارات مستنية منك','لما نحتاج قرار — لون، خامة، بديل — هيظهر هنا بالتكلفة وأثر التأخير.');

  /* الكاميرات */
  $('cams').innerHTML = d.cameras.length ? d.cameras.map(c=>`
    <div class="card"><div class="row"><b>${esc(c.name)}</b>
      <span class="chip ${c.state==='شغالة'?'c-ok':'c-idle'}">${esc(c.state)}</span></div>
      <div class="muted">${esc(c.place)}</div>
      ${c.live?`<div style="margin-top:10px"><a href="${c.live}" target="_blank"
        style="display:inline-block;background:var(--gold);color:#0B0D0E;padding:8px 18px;
        border-radius:8px;font-weight:700;font-size:13.5px">شوف البث</a></div>`:''}
    </div>`).join('') : empty('🎥','الكاميرات مش مفعّلة على مشروعك',
      'خدمة إضافية: كاميرا في الموقع + فيديو سريع يومي بيلخّص شغل اليوم كله في دقيقة. كلّمنا لو تحب نفعّلها.');

  var _b=document.getElementById('boot'); if(_b) _b.style.display='none';
  $('upd').textContent='آخر مزامنة '+new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
}

function empty(ic,t,p){ return `<div class="empty"><div class="ic">${ic}</div><b>${t}</b><p>${p}</p></div>`; }
function lb(u){ const l=$('lb'); l.querySelector('img').src=u; l.classList.add('on'); }

/* ── التحميل ── */
async function load(){
  if(!P||!T){ return fail('الرابط ناقص','اطلب من طراز يبعتلك الرابط الكامل تاني.'); }
  const cached=localStorage.getItem(KEY);
  if(cached){ try{ render(JSON.parse(cached)); $('boot').style.display='none'; }catch(e){} }
  try{
    const r=await fetch(API+'?p='+encodeURIComponent(P)+'&t='+encodeURIComponent(T),{credentials:'omit'});
    const j=await r.json();
    if(j.error) throw new Error(j.error);
    localStorage.setItem(KEY,JSON.stringify(j));
    render(j); $('boot').style.display='none'; $('off').classList.remove('on');
  }catch(e){
    if(cached){ $('off').classList.add('on'); $('off').textContent='مفيش نت — دي آخر نسخة محفوظة'; }
    else fail('مش قادرين نوصل لبيانات مشروعك',String(e.message||e));
  }
}
function fail(t,p){ $('boot').innerHTML=`<div class="wrap">${empty('⚠',t,p)}
  <div style="text-align:center"><a href="https://wa.me/201214503036"
   style="display:inline-block;background:var(--gold);color:#0B0D0E;padding:11px 24px;
   border-radius:9px;font-weight:700;margin-top:10px">كلّمنا على واتساب</a></div></div>`; }

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>tab(t.dataset.t));
$('lb').onclick=()=>$('lb').classList.remove('on');
addEventListener('keydown',e=>{if(e.key==='Escape')$('lb').classList.remove('on')});
if(location.hash) tab(location.hash.slice(1));
load();
setInterval(load,180000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
