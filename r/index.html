<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>متابعة مشروعك | طراز ريموت</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0D0E">
<link rel="manifest" id="manifestLink" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="طراز ريموت">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
(function(){
  try{
    var params = new URLSearchParams(location.search);
    var code = params.get('p') || '';
    if(!code) return; // مفيش كود مشروع في اللينك، سيب المانيفست العام زي ما هو
    var manifest = {
      name: 'لوحة متابعة — ' + code,
      short_name: code,
      start_url: location.pathname + location.search,
      scope: location.pathname,
      display: 'standalone',
      background_color: '#0B0D0E',
      theme_color: '#0B0D0E',
      icons: [
        {src: new URL('icon-192.png', location.href).href, sizes: '192x192', type: 'image/png'},
        {src: new URL('icon-512.png', location.href).href, sizes: '512x512', type: 'image/png'}
      ]
    };
    var blobUrl = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: 'application/json'}));
    document.getElementById('manifestLink').setAttribute('href', blobUrl);
  }catch(e){}
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0D0E;--panel:#131719;--panel2:#0F1213;--line:#262D31;--gold:#B78D65;
 --gold-hi:#D8B78E;--gold-dim:rgba(183,141,101,.12);--tx:#EDEAE6;--mut:#A8B0B6;--mut2:#7A828A;
 --ok:#199e70;--ok-hi:#5FCF8E;--warn:#c98500;--info:#3987e5;--bad:#D96A5B}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--ink);color:var(--tx);font-family:Tajawal,system-ui,sans-serif;
 line-height:1.7;padding-bottom:78px;overflow-x:hidden}
.mono{font-family:'IBM Plex Mono',monospace;font-size:.92em;direction:ltr;unicode-bidi:isolate}
.wrap{max-width:940px;margin:0 auto;padding:0 16px}
a{color:inherit;text-decoration:none}

/* هيدر */
header{background:linear-gradient(180deg,#12171A,var(--ink));border-bottom:1px solid var(--line);
 padding:16px 0 18px;position:sticky;top:0;z-index:40;backdrop-filter:blur(14px)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lg{display:flex;align-items:center;gap:10px}
.lgw b{display:block;font-size:15px;font-weight:800;letter-spacing:.05em;direction:ltr;line-height:1}
.lgw b i{color:var(--gold);font-style:normal}
.lgw small{display:block;direction:ltr;font-family:'IBM Plex Mono',monospace;font-size:7px;
 color:var(--mut2);margin-top:4px;width:100%;text-align:justify;text-align-last:justify;
 text-justify:inter-character}
.live{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut2);
 background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 11px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok-hi);flex:0 0 auto;
 animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
h1{font-size:clamp(18px,4.2vw,25px);font-weight:800;margin-top:14px;line-height:1.35}
.sub{color:var(--mut2);font-size:13px;margin-top:5px}
.idrow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-top:18px;flex-wrap:wrap}
.titlewrap{flex:1;min-width:0}
.titlewrap h1{margin:0}
.titlewrap .sub{margin-top:6px}
.profile{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.avatar{width:44px;height:44px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(135deg,var(--gold),var(--gold-hi));
  color:var(--ink);display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800}
.profile-txt{min-width:0;text-align:end}
.ptag{font-size:11px;color:var(--gold-hi);letter-spacing:.03em}
.pname{font-size:16px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
@media(max-width:620px){
  .idrow{flex-direction:column-reverse;align-items:stretch;gap:12px}
  .profile{justify-content:flex-start}
  .profile-txt{text-align:start}
  .pname{max-width:220px}
}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:18px}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){
  header{padding:12px 0 14px}
  .kpis{grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
  .kpi{padding:8px 4px;border-radius:9px}
  .kpi .v{font-size:15px}
  .kpi .l{font-size:8.3px;margin-top:2px;line-height:1.2}
  .now-on{padding:8px 11px;margin-top:9px;font-size:12px}
  .tl{margin-top:10px}
  .sub{font-size:11.5px;margin-top:3px}
}
body.scrolled #kpis,body.scrolled #nowon,body.scrolled #tl,body.scrolled .profile,body.scrolled .titlewrap .sub{
  display:none!important}
body.scrolled header{padding:10px 0}
body.scrolled #ttl{font-size:15px}
body.scrolled .idrow{margin-top:8px}
header{transition:padding .15s}
#ttl{transition:font-size .15s}
.kpi.bad .v{color:var(--bad)}
.hero{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:12px;margin-bottom:14px;cursor:pointer}
.hero img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:0 0 auto}
.hero .t{min-width:0}
.hero .t b{display:block;font-size:14px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .t span{color:var(--mut2);font-size:12px}
.now-on{background:var(--gold-dim);border:1px solid rgba(183,141,101,.35);border-radius:10px;
  padding:10px 14px;font-size:13px;margin-top:12px;display:flex;justify-content:space-between;gap:10px}
.now-on b{color:var(--gold-hi)}
body.archive-view #kpis,body.archive-view #nowon,body.archive-view #tl{display:none!important}
body.archive-view header{padding-bottom:8px}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:32px 28px;margin-bottom:28px}
@media(max-width:600px){.rcard{padding:22px 16px}}
.rtitle{font-size:27px;font-weight:bold}
.rdate{font-size:13px;color:var(--mut2);margin-top:6px}
.rdelta{font-size:14px;margin-top:14px;font-weight:600}
.rhero{display:flex;justify-content:center;flex-wrap:wrap;gap:48px;margin:28px 0;padding:28px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.rhero .hitem{text-align:center}
.rhero .hitem .cap{font-size:13px;color:var(--mut2);margin-top:10px}
.rstatbar{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:36px}
@media(max-width:560px){.rstatbar{grid-template-columns:repeat(2,1fr)}}
.rstatbar .sc{background:var(--panel2);border-radius:14px;padding:20px 10px;text-align:center}
.rstatbar .sc .v{font-size:27px;font-weight:bold}
.rstatbar .sc .l{font-size:12px;color:var(--mut2);margin-top:6px}
.rblock{margin-bottom:36px}
.rblock:last-child{margin-bottom:0}
.rblock .bh{display:flex;align-items:center;gap:11px;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid var(--gold)}
.rblock .bh .ic{font-size:21px}
.rblock .bh .tt{font-size:17px;font-weight:bold}
.rlist{display:flex;flex-direction:column;gap:11px}
.rlist .li{display:flex;align-items:center;gap:12px;padding:15px 18px;background:var(--panel2);border-radius:12px;font-size:15px;line-height:1.6}
.rlist .li .chk{color:var(--ok-hi);font-size:18px;flex:0 0 auto}
.rlist .li .warn{color:var(--warn);font-size:18px;flex:0 0 auto}
.rmatgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.rmatcard{background:var(--panel2);border-radius:16px;overflow:hidden;cursor:pointer}
.rmatcard img{width:100%;height:160px;object-fit:cover;display:block}
.rmatcard .info{padding:14px 16px}
.rmatcard .nm{font-size:15px;font-weight:bold;margin-bottom:5px}
.rmatcard .sup{font-size:12px;color:var(--mut2);margin-bottom:10px}
.rmatcard .pr{font-size:16px;color:var(--gold-hi);font-weight:bold}
.rtrend{padding:8px 4px 0}
.rtrend .bars{display:flex;align-items:flex-end;gap:10px;height:120px}
.rtrend .bars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.rtrend .bars .b{width:100%;border-radius:6px 6px 0 0}
.rtrend .bars .pc{font-size:13px;font-weight:bold}
.rtrend .bars .wk{font-size:10px;color:var(--mut2)}
.rnext{background:var(--gold-dim);border:1px solid rgba(183,141,101,.4);border-radius:16px;padding:22px;font-size:15px;line-height:1.9}
.rnext b{color:var(--gold-hi)}
.rday{margin-bottom:18px}
.rday:last-child{margin-bottom:0}
.rday .dh{font-size:13px;color:var(--gold-hi);font-weight:bold;margin-bottom:8px;padding-inline-start:2px}
.rday .li{align-items:flex-start}
.rday .li .tm{font-size:11px;color:var(--mut2);flex:0 0 auto;margin-inline-start:6px}
.money-row{display:flex;justify-content:space-between;align-items:baseline;padding:13px 18px;
  background:var(--panel2);border-radius:12px;font-size:14px}
.money-row b{font-size:16px}
.traffic{margin-top:12px;padding:14px 18px;border-radius:12px;font-size:14px;display:flex;align-items:center;gap:10px}
.traffic.g{background:rgba(95,207,142,.1);border:1px solid rgba(95,207,142,.3)}
.traffic.y{background:rgba(201,133,0,.1);border:1px solid rgba(201,133,0,.3)}
.traffic.r{background:rgba(217,106,91,.1);border:1px solid rgba(217,106,91,.3)}
.tl{margin-top:16px}
.tl .bar{position:relative;height:6px;background:var(--line);border-radius:4px;margin:8px 0}
.tl .fill{position:absolute;inset-inline-start:0;top:0;bottom:0;background:var(--gold);border-radius:4px}
.tl .now{position:absolute;top:-4px;width:2px;height:14px;background:var(--tx)}
.tl .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut2)}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 13px}
.kpi .v{font-size:26px;font-weight:800;line-height:1.1;font-family:'IBM Plex Mono',monospace;
 direction:ltr;text-align:start}
.kpi .l{font-size:11.6px;color:var(--mut2);margin-top:4px}
.kpi.g .v{color:var(--ok-hi)} .kpi.o .v{color:var(--gold-hi)} .kpi.w .v{color:var(--warn)}

/* تبويبات */
nav.tabs{position:fixed;bottom:0;inset-inline:0;background:rgba(11,13,14,.96);
 backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:50;
 padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:940px;margin:0 auto;display:flex}
.tab{flex:1;padding:11px 4px 9px;text-align:center;color:var(--mut2);font-size:11px;
 border-top:2px solid transparent;transition:.2s;cursor:pointer;background:none;border-inline:0;
 border-bottom:0;font-family:inherit}
.tab.on{color:var(--gold-hi);border-top-color:var(--gold)}
.tab svg{display:block;margin:0 auto 3px;opacity:.9}
section.pane{display:none;padding-top:22px}
section.pane.on{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* عام */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
 padding:16px 17px;margin-bottom:11px}
.card h3{font-size:15px;margin-bottom:11px;display:flex;align-items:center;gap:8px}
.cat{font-size:11.5px;color:var(--gold);font-family:'IBM Plex Mono',monospace;
 letter-spacing:.08em;margin:22px 0 9px}
.bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:4px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row b{font-size:14.5px;font-weight:500}
.pct{font-family:'IBM Plex Mono',monospace;font-size:13px;direction:ltr}
.muted{color:var(--mut2);font-size:12.6px}
.note{font-size:13px;color:var(--mut);font-weight:300;margin-top:7px;line-height:1.75}
.chip{display:inline-block;font-size:11px;border-radius:6px;padding:3px 9px;white-space:nowrap}
.c-ok{background:rgba(25,158,112,.16);color:var(--ok-hi);border:1px solid rgba(25,158,112,.35)}
.c-run{background:rgba(201,133,0,.15);color:#E8B45C;border:1px solid rgba(201,133,0,.35)}
.c-idle{background:rgba(122,130,138,.12);color:var(--mut2);border:1px solid var(--line)}
.c-bad{background:rgba(217,106,91,.15);color:var(--bad);border:1px solid rgba(217,106,91,.35)}

/* صور */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.ph{aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--panel2);
 border:1px solid var(--line);cursor:pointer;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.ph:hover img{transform:scale(1.05)}
.ph span{position:absolute;inset-inline:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.85));
 padding:16px 8px 6px;font-size:10.5px;color:#DDD;font-family:'IBM Plex Mono',monospace;direction:ltr}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:99;display:none;
 place-items:center;padding:18px;cursor:zoom-out}
#lb.on{display:grid}
#lb img{max-width:100%;max-height:88vh;border-radius:10px}

/* فاضي */
.empty{text-align:center;padding:46px 18px;color:var(--mut2)}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:7px;font-weight:700}
.empty p{font-size:13.6px;font-weight:300;line-height:1.85;max-width:330px;margin:0 auto}
.empty .ic{font-size:34px;opacity:.35;margin-bottom:12px}

/* تنبيه */
.alert{background:linear-gradient(180deg,rgba(201,133,0,.13),rgba(201,133,0,.04));
 border:1px solid rgba(201,133,0,.35);border-radius:13px;padding:14px 16px;margin-bottom:12px;
 display:flex;gap:11px;font-size:13.6px;line-height:1.75}
.alert b{color:#E8B45C}
.offline{position:fixed;top:0;inset-inline:0;background:var(--warn);color:#0B0D0E;
 text-align:center;padding:6px;font-size:12.5px;font-weight:700;z-index:99;display:none}
.offline.on{display:block}

/* تحميل */
.sk{background:linear-gradient(90deg,var(--panel) 25%,#1A1F22 50%,var(--panel) 75%);
 background-size:200% 100%;animation:sh 1.4s infinite;border-radius:12px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.foot{text-align:center;padding:30px 16px 10px;color:var(--mut2);font-size:12px;
 border-top:1px solid var(--line);margin-top:26px}
.foot a{color:var(--gold-hi)}
</style></head><body>

function ago(iso){
  if(!iso) return '';
  const d=new Date(String(iso).replace(' ','T'));
  if(isNaN(d)) return iso;
  const m=Math.floor((Date.now()-d)/60000);
  if(m<2) return 'دلوقتي';
  if(m<60) return 'من '+m+' دقيقة';
  const h=Math.floor(m/60);
  if(h<24) return 'من '+h+' ساعة';
  const dd=Math.floor(h/24);
  if(dd===1) return 'إمبارح';
  if(dd<30) return 'من '+dd+' يوم';
  return d.toLocaleDateString('ar-EG');
}

}
function trendBlock(repsAsc){
  const max=Math.max.apply(null,repsAsc.map(r=>r.progress).concat([10]));
  return `<div class="rtrend"><div class="bars">
    ${repsAsc.map((r,idx)=>`<div title="${esc(r.week)}">
      <div class="pc">${r.progress}%</div>
      <div class="b" style="background:${idx===repsAsc.length-1?'var(--ok-hi)':'var(--line)'};
        height:${Math.max(r.progress/max*88,4)}px"></div>
      <div class="wk">${esc(r.week.replace('الأسبوع ',''))}</div>
    </div>`).join('')}
  </div></div>`;
}
function matBigCard(m,items){
  const it=items.find(i=>i.code===m.item)||{};
  return `<div class="rmatcard" onclick="lb('${m.photo}')">
    <img src="${m.photo}" loading="lazy">
    <div class="info">
      <div class="nm">${esc(m.name)}</div>
      <div class="sup">للبند: ${esc(it.name||m.item)}${m.supplier?' · '+esc(m.supplier):''}</div>
      <div class="pr">${money(m.price)} ج.م</div>
    </div>
  </div>`;
}
function stateChip(s,p){
  if(p>=100) return '<span class="chip c-ok">خلص</span>';
  if(p>0) return '<span class="chip c-run">شغال</span>';
  return '<span class="chip c-idle">لسه ما بدأش</span>';
}

/* ── التبويبات ── */
function tab(n){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.t===n));
  document.querySelectorAll('.pane').forEach(s=>s.classList.toggle('on',s.id==='p-'+n));
  document.body.classList.toggle('archive-view', n==='rep');
  window.scrollTo({top:0,behavior:'smooth'});
  try{ history.replaceState(null,'','#'+n); }catch(e){}
}

/* ── الرسم ── */
function render(d){
  D=d;
  const pr=d.project, k=d.kpi;
  const clientClean = (pr.client||'').replace(/^(أ\.|م\.|د\.|مهندس\/?|المهندس\/?|الأستاذ\/?|الأستاذة\/?)\s*/,'').trim();
  $('clientName').textContent = pr.client || 'عميلنا العزيز';
  $('avatar').textContent = clientClean ? clientClean.charAt(0) : 'ط';
  $('ttl').textContent=pr.name||'مشروعك';
  $('sub').innerHTML=esc(pr.code)+' · '+esc(pr.area||'')+' م²'+
    (pr.start?' · بدأ '+esc(String(pr.start).split(' ')[0]):'');
  $('last').textContent = d.lastUpdate ? ago(d.lastUpdate) : 'مفيش تحديث لسه';

  const spentBad = k.budget && k.spentPct > k.progress + 10;
  $('kpis').innerHTML=[
    ['g',k.progress+'%','نسبة الإنجاز'],
    ['o',k.itemsDone+'/'+k.itemsTotal,'بنود خلصت'],
    [spentBad?'bad':'w',(k.budget?k.spentPct+'%':'—'),'المنصرف من الميزانية'],
    ['',(d.photos.length||0),'صورة من الموقع']
  ].map(([c,v,l])=>`<div class="kpi ${c}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');

  /* Timeline: بدء → اليوم → تسليم */
  if(pr.start && pr.due){
    const s=new Date(pr.start), e=new Date(pr.due), now=new Date();
    const total=e-s, passed=Math.min(Math.max(now-s,0),total);
    const pct=total>0?Math.round(passed/total*100):0;
    $('tl').style.display='block';
    $('tl-a').textContent='بدأ '+s.toLocaleDateString('ar-EG');
    $('tl-b').textContent='التسليم '+e.toLocaleDateString('ar-EG');
    $('tl-fill').style.width=pct+'%';
    $('tl-now').style.insetInlineStart=pct+'%';
  }

  /* أحدث صورة — البطلة */
  const heroUpdate = (d.updates||[]).find(u=>u.photos && u.photos.length);
  $('hero').innerHTML = heroUpdate ? `<div class="hero" onclick="tab('photo')">
      <img loading="lazy" src="${heroUpdate.photos[0]}">
      <div class="t"><b>${esc(heroUpdate.note||'آخر تحديث من الموقع')}</b><span>${ago(heroUpdate.at)}</span></div>
    </div>` : '';

  /* دلوقتي بيشتغل على — أول بند شغال (بين 1 و99%) */
  const nowOn = (d.items||[]).find(i=>i.pct>0 && i.pct<100);
  $('nowon').innerHTML = nowOn ? `<div class="now-on"><span><b>دلوقتي بيشتغل على:</b> ${esc(nowOn.name)}</span><span>${nowOn.pct}%</span></div>` : '';

  /* تنبيهات */
  let al='';
  if(k.decisionsOpen) al+=`<div class="alert"><b>◆</b><div><b>مستني قرار منك</b> — ${k.decisionsOpen} قرار.
    كل يوم تأخير فيهم بيأخّر التسليم بيوم. شوف تبويبة «القرارات».</div></div>`;
  if(k.paymentsDue) al+=`<div class="alert"><b>◆</b><div><b>دفعة مستحقة</b> — ${k.paymentsDue}.
    التفاصيل في تبويبة «الفلوس».</div></div>`;
  $('alerts').innerHTML=al;

  /* الملخص: آخر التحديثات + الخامات مع بعض */
  const feedList = d.feed || d.updates;
  $('feed').innerHTML = feedList.length ? feedList.slice(0,14).map(u=>{
    if(u.type==='material'){
      const it=d.items.find(i=>i.code===u.item)||{};
      return `<div class="card">
        <div class="row"><b><span style="color:var(--gold-hi)">◆</span> ${esc(u.name)}</b><span class="muted mono">${ago(u.at)}</span></div>
        <div class="note">خامة جديدة للبند: ${esc(it.name||u.item)}${u.price?' · '+money(u.price)+' ج.م':''}</div>
        <div class="grid" style="margin-top:10px">
          ${u.photo?`<div class="ph" onclick="lb('${u.photo}')"><img loading="lazy" src="${u.photo}"><span>الخامة</span></div>`:''}
        </div>
      </div>`;
    }
    const it=d.items.find(i=>i.code===u.item)||{};
    const ph=(u.photos||[]).slice(0,3).map(p=>`<div class="ph" onclick="lb('${p}')"><img loading="lazy" src="${p}"></div>`).join('');
    return `<div class="card">
      <div class="row"><b>${esc(it.name||u.item)}</b><span class="muted mono">${ago(u.at)}</span></div>
      <div class="note">${esc(u.note)}</div>
      <div class="bar"><i style="width:${u.pct}%;background:${barColor(u.pct)}"></i></div>
      ${ph?`<div class="grid" style="margin-top:10px">${ph}</div>`:''}
    </div>`;
  }).join('') : empty('📋','لسه مفيش تحديثات منشورة',
     'أول ما المهندس يبعت تحديث أو خامة من الموقع والمكتب يراجعه، هيظهر هنا بصوره وتاريخه.');

  /* البنود */
  const cats={};
  d.items.forEach(i=>{(cats[i.cat]=cats[i.cat]||[]).push(i)});
  $('items').innerHTML=Object.entries(cats).map(([c,arr])=>{
    const avg=Math.round(arr.reduce((a,i)=>a+i.pct,0)/arr.length);
    return `<div class="cat">${esc(c)} · ${avg}%</div>`+arr.map(i=>`
      <div class="card" style="padding:13px 15px">
        <div class="row"><b>${esc(i.name)}</b>
          <span>${(i.materials&&i.materials.length)?`<span class="pct" style="background:var(--gold-dim);color:var(--gold-hi)">◆ ${i.materials.length}</span> `:''}${stateChip(i.state,i.pct)} <span class="pct">${i.pct}%</span></span></div>
        <div class="bar"><i style="width:${i.pct}%;background:${barColor(i.pct)}"></i></div>
        ${i.note?`<div class="note">${esc(i.note)} <span class="muted">· ${ago(i.at)}</span></div>`:''}
        ${(i.materials&&i.materials.length)?`<div class="grid" style="margin-top:10px">`+i.materials.map(mt=>`
          <div class="ph" onclick="lb('${mt.photo}')"><img loading="lazy" src="${mt.photo}"><span>${esc(mt.name)}</span></div>`
          ).join('')+`</div>`:''}
      </div>`).join('');
  }).join('');

  /* الصور */
  $('photos').innerHTML = d.photos.length
    ? `<div class="grid">`+d.photos.map(p=>`<div class="ph" onclick="lb('${p.url}')">
         <img loading="lazy" src="${p.url}"><span>${esc(String(p.at).split(' ')[0])}</span></div>`).join('')+`</div>`
    : empty('📷','مفيش صور لسه','الصور بتتصوّر في الموقع وبتوصل هنا بعد مراجعة المكتب — عادةً في نفس اليوم.');

  /* الخامات */
  const matsList = d.materials || [];
  const matsTotal = k.materialsTotal || 0;
  const matsHeader = `<div class="card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="muted">إجمالي فواتير الخامات لحد دلوقتي</div>
      <b class="mono" style="color:var(--gold-hi);font-size:22px">${money(matsTotal)} ج.م</b>
    </div>`;
  $('mats').innerHTML = matsList.length ? matsHeader + matsList.map(mt=>{
    const it = d.items.find(i=>i.code===mt.item) || {};
    return `<div class="card">
      <div class="row"><b style="font-size:15px">${esc(mt.name)}</b><span class="muted mono">${ago(mt.at)}</span></div>
      <div class="muted" style="margin:2px 0 12px">للبند: ${esc(it.name||mt.item)}${mt.supplier?' · المورد: '+esc(mt.supplier):''}</div>
      <div class="grid">
        ${mt.photo?`<div class="ph" onclick="lb('${mt.photo}')"><img loading="lazy" src="${mt.photo}"><span>الخامة</span></div>`:''}
        ${mt.invoice?`<div class="ph" onclick="lb('${mt.invoice}')"><img loading="lazy" src="${mt.invoice}"><span>الفاتورة</span></div>`:''}
      </div>
      <div class="row" style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">
        <span class="muted">سعر الفاتورة</span><b class="mono" style="color:var(--gold-hi)">${money(mt.price)} ج.م</b>
      </div>
    </div>`;
  }).join('') : empty('◆','لسه مفيش خامات موثّقة','أول ما المهندس يصوّر خامة وفاتورتها من الموقع، هتظهر هنا بند ببند.');

  /* التقرير الأسبوعي — تقرير كامل واسع */
  const reps = d.reports || [];
  const repsAsc = [...reps].reverse();
  $('reports').innerHTML = reps.length ? reps.map((r,i)=>{
    const deltaColor = r.progressDelta>0?'var(--ok-hi)':r.progressDelta<0?'var(--bad)':'var(--mut2)';
    const deltaTxt = r.progressDelta>0?`▲ اتحسّن ${r.progressDelta}% عن الأسبوع اللي فات`
                   : r.progressDelta<0?`▼ اتأخر ${Math.abs(r.progressDelta)}% عن الأسبوع اللي فات`
                   : 'نفس نسبة الأسبوع اللي فات بالظبط';
    const idxAsc = repsAsc.indexOf(r);
    const upToHere = repsAsc.slice(0, idxAsc+1);
    const matsThisWeek = (d.materials||[]).filter(m=>{
      const day = String(m.at).slice(0,10);
      return day >= r.from && day <= r.to;
    });
    const doneList = (r.itemsDoneNames?r.itemsDoneNames.split('، '):[]).filter(Boolean);

    const budget = k.budget||0;
    const spentSoFar = r.spent || Math.round(budget*r.spentPct/100);
    const remaining = budget - spentSoFar;
    const gap = r.spentPct - r.progress;
    const tCls = gap>15?'r':gap>5?'y':'g';
    const tIcon = gap>15?'🔴':gap>5?'🟡':'🟢';
    const tTxt = gap>15?'بيتصرف على المشروع أسرع بكتير من نسبة التنفيذ الفعلية — يستاهل مراجعة.'
               : gap>5?'بيتصرف شوية أسرع من نسبة التنفيذ — طبيعي في مراحل التأسيس والخامات المدفوعة مقدّمًا.'
               : 'المنصرف متماشي كويس مع نسبة الإنجاز الفعلية.';

    const updsThisWeek = (d.updates||[]).filter(u=>{
      const day = String(u.at).slice(0,10);
      return day >= r.from && day <= r.to;
    });
    const byDay = {};
    updsThisWeek.forEach(u=>{ const day=String(u.at).slice(0,10); (byDay[day]=byDay[day]||[]).push(u); });
    const days = Object.keys(byDay).sort();
    const openDecisions = (d.decisions||[]).filter(x=>x.state==='مطلوب');
    const duePays = (d.payments||[]).filter(p=>p.state==='مستحقة'||p.state==='متأخرة');

    return `<div class="rcard">
      <div class="rtitle">${esc(r.week)}</div>
      <div class="rdate mono">${esc(r.from)} → ${esc(r.to)}</div>
      <div class="rdelta" style="color:${deltaColor}">${deltaTxt}</div>

      <div class="rhero">
        <div class="hitem">${donutBig(r.progress,'var(--ok-hi)','نسبة الإنجاز')}</div>
        <div class="hitem">${donutBig(r.spentPct,'var(--gold-hi)','المنصرف من الميزانية')}</div>
      </div>

      ${budget?repBlock('💰','الوضع المالي',`<div class="rlist">
        <div class="money-row"><span class="muted">الميزانية الكلية</span><b class="mono">${money(budget)} ج.م</b></div>
        <div class="money-row"><span class="muted">المنصرف لحد الأسبوع ده</span><b class="mono" style="color:var(--gold-hi)">${money(spentSoFar)} ج.م</b></div>
        <div class="money-row"><span class="muted">الباقي من الميزانية</span><b class="mono" style="color:var(--ok-hi)">${money(remaining)} ج.م</b></div>
        <div class="money-row"><span class="muted">خامات اترفت الأسبوع ده تحديدًا</span><b class="mono">${money(r.materialsValue||0)} ج.م</b></div>
      </div>
      <div class="traffic ${tCls}"><span>${tIcon}</span><span>${tTxt}</span></div>`):''}

      <div class="rstatbar">
        <div class="sc"><div class="v">${r.itemsDone}</div><div class="l">بنود خلصت</div></div>
        <div class="sc"><div class="v">${r.photosCount||0}</div><div class="l">صورة من الموقع</div></div>
        <div class="sc"><div class="v">${r.materialsCount||0}</div><div class="l">خامة اتوثّقت</div></div>
        <div class="sc"><div class="v mono" style="color:var(--gold-hi)">${money(r.materialsValue||0)}</div><div class="l">ج.م قيمة الخامات</div></div>
      </div>

      ${doneList.length?repBlock('🏗️','البنود اللي خلصت الأسبوع ده',
        `<div class="rlist">${doneList.map(n=>`<div class="li"><span class="chk">✓</span><span>${esc(n)}</span></div>`).join('')}</div>`):''}

      ${matsThisWeek.length?repBlock('◆','الخامات اللي اترفت الأسبوع ده',
        `<div class="rmatgrid">${matsThisWeek.map(m=>matBigCard(m,d.items)).join('')}</div>`):''}

      ${openDecisions.length?repBlock('📋','قرارات مستنية منك حاليًا',
        `<div class="rlist">${openDecisions.map(x=>`<div class="li">
          <span class="warn">◆</span>
          <span><b>${esc(x.title)}</b>${x.impact?' — '+esc(x.impact):''}${x.days?` <span class="muted">(بيأخّر التسليم ${x.days} يوم)</span>`:''}</span>
        </div>`).join('')}</div>`):''}

      ${duePays.length?repBlock('💰','دفعات مستحقة حاليًا',
        `<div class="rlist">${duePays.map(p=>`<div class="li" style="justify-content:space-between">
          <span>${esc(p.desc)}${p.due?' <span class="muted">— مستحقة '+esc(p.due)+'</span>':''}</span>
          <b class="mono" style="color:var(--gold-hi)">${money(p.amount)} ج.م</b>
        </div>`).join('')}</div>`):''}

      ${days.length?repBlock('📝','يوميات الموقع يوم بيوم',
        days.map(day=>`<div class="rday">
          <div class="dh">${dayLabel(day)}</div>
          <div class="rlist">${byDay[day].map(u=>{
            const it=d.items.find(i=>i.code===u.item)||{};
            return `<div class="li"><span class="chk">•</span><span><span class="tm mono">${timeOnly(u.at)}</span>${it.name?'<b>'+esc(it.name)+':</b> ':''}${esc(u.note)}</span></div>`;
          }).join('')}</div>
        </div>`).join('')):''}

      ${upToHere.length>1?repBlock('📈','مسار الإنجاز عبر الأسابيع',trendBlock(upToHere)):''}

      ${r.nextWeek?repBlock('◆','الأسبوع الجاي',`<div class="rnext"><b>الخطة:</b> ${esc(r.nextWeek)}</div>`):''}
    </div>`;
  }).join('') : empty('📆','لسه مفيش تقرير أسبوعي','كل خميس هيتولد تقرير جديد يلخّص أهم ما حصل في مشروعك.');

  /* الفلوس */
  let m='';
  if(k.budget){
    m+=`<div class="card"><h3>الميزانية</h3>
      <div class="row"><span class="muted">المعتمد</span><b class="mono">${money(k.budget)}</b></div>
      <div class="row" style="margin-top:6px"><span class="muted">المنصرف</span>
        <b class="mono" style="color:var(--gold-hi)">${money(k.spent)}</b></div>
      <div class="bar" style="margin-top:10px"><i style="width:${Math.min(100,k.spentPct)}%;
        background:${k.spentPct>k.progress+10?'var(--bad)':'var(--gold)'}"></i></div>
      <div class="muted" style="margin-top:8px">المنصرف ${k.spentPct}% مقابل إنجاز ${k.progress}%
        ${k.spentPct>k.progress+10?' — <b style="color:var(--bad)">فيه فرق يستاهل مراجعة</b>':''}</div></div>`;
    if(d.boq.length) m+=`<div class="card"><h3>بند بند</h3>`+d.boq.map(b=>`
      <div style="margin-bottom:11px"><div class="row"><b style="font-size:13.6px">${esc(b.cat)}</b>
        <span class="pct">${money(b.spent)} / ${money(b.budget)}</span></div>
      <div class="bar"><i style="width:${Math.min(100,b.pct)}%;background:var(--gold)"></i></div></div>`).join('')+`</div>`;
  }
  if(d.payments.length) m+=`<div class="card"><h3>الدفعات</h3>`+d.payments.map(p=>{
    const c=p.state==='مدفوعة'?'c-ok':p.state==='متأخرة'?'c-bad':p.state==='مستحقة'?'c-run':'c-idle';
    return `<div class="row" style="margin-bottom:9px"><div><b style="font-size:14px">${esc(p.desc)}</b>
      <div class="muted">${esc(p.due||'')}</div></div>
      <div style="text-align:end"><div class="mono">${money(p.amount)}</div>
      <span class="chip ${c}">${esc(p.state)}</span></div></div>`;
  }).join('')+`</div>`;
  $('money').innerHTML = m || empty('◆','الجزء المالي لسه ما اتفعّلش',
    'أول ما المقايسة تتعتمد، هتشوف هنا كل جنيه راح فين بفاتورته.');

  /* القرارات */
  $('dec').innerHTML = d.decisions.length ? d.decisions.map(x=>`
    <div class="card"><div class="row"><b>${esc(x.title)}</b>
      <span class="chip ${x.state==='مطلوب'?'c-run':'c-ok'}">${esc(x.state)}</span></div>
      <div class="note">${esc(x.why)}</div>
      ${x.before?`<div class="muted" style="margin-top:8px">مطلوب قبل: ${esc(x.before)}</div>`:''}
      ${x.impact?`<div class="alert" style="margin:10px 0 0"><b>◆</b><div>${esc(x.impact)}</div></div>`:''}
    </div>`).join('') : empty('✓','مفيش قرارات مستنية منك','لما نحتاج قرار — لون، خامة، بديل — هيظهر هنا بالتكلفة وأثر التأخير.');

  /* الكاميرات */
  $('cams').innerHTML = d.cameras.length ? d.cameras.map(c=>`
    <div class="card"><div class="row"><b>${esc(c.name)}</b>
      <span class="chip ${c.state==='شغالة'?'c-ok':'c-idle'}">${esc(c.state)}</span></div>
      <div class="muted">${esc(c.place)}</div>
      ${c.live?`<div style="margin-top:10px"><a href="${c.live}" target="_blank"
        style="display:inline-block;background:var(--gold);color:#0B0D0E;padding:8px 18px;
        border-radius:8px;font-weight:700;font-size:13.5px">شوف البث</a></div>`:''}
    </div>`).join('') : empty('🎥','الكاميرات مش مفعّلة على مشروعك',
      'خدمة إضافية: كاميرا في الموقع + فيديو سريع يومي بيلخّص شغل اليوم كله في دقيقة. كلّمنا لو تحب نفعّلها.');

  var _b=document.getElementById('boot'); if(_b) _b.style.display='none';
  $('upd').textContent='آخر مزامنة '+new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
}

function empty(ic,t,p){ return `<div class="empty"><div class="ic">${ic}</div><b>${t}</b><p>${p}</p></div>`; }
function lb(u){ const l=$('lb'); l.querySelector('img').src=u; l.classList.add('on'); }

/* ── التحميل ── */
async function load(){
  if(!P||!T){ return fail('الرابط ناقص','اطلب من طراز يبعتلك الرابط الكامل تاني.'); }
  const cached=localStorage.getItem(KEY);
  if(cached){ try{ render(JSON.parse(cached)); $('boot').style.display='none'; }catch(e){} }
  try{
    const r=await fetch(API+'?p='+encodeURIComponent(P)+'&t='+encodeURIComponent(T),{credentials:'omit'});
    const j=await r.json();
    if(j.error) throw new Error(j.error);
    localStorage.setItem(KEY,JSON.stringify(j));
    render(j); $('boot').style.display='none'; $('off').classList.remove('on');
  }catch(e){

}
